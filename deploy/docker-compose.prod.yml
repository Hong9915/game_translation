# 운영 서버(Lightsail 1GB)용. 이미지는 로컬에서 linux/amd64로 빌드해 docker save로 옮긴다 (deploy/deploy.sh).
# 서버의 /opt/gt 아래에 .env, .env.local, htpasswd, data/ 가 있어야 한다.
# HTTPS 인증서는 letsencrypt/ 에 있다. 처음 한 번은 deploy/setup-https.sh로 받는다.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gametrans
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # 외부에 열지 않는다. 백엔드만 컨테이너 네트워크로 붙는다.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gametrans"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    image: gt-backend:prod
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      SUPABASE_DB_URL: jdbc:postgresql://postgres:5432/gametrans
      SUPABASE_DB_USER: postgres
      SUPABASE_DB_PASSWORD: postgres
      STORAGE_TYPE: local
      STORAGE_LOCAL_DIR: /data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # 4GB 서버(medium_3_0) 기준. 힙 2GB + 메타스페이스 192MB면 Postgres·nginx·OS 여유가 남는다. 서버를 줄이면 같이 줄일 것.
      JAVA_TOOL_OPTIONS: "-Xmx2g -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
      JOSA_URL: http://josa:8000
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 조사 검사(Kiwi 약 450MB). 외부에 열지 않는다. 죽어도 번역 저장은 막히지 않는다(검사만 미뤄진다).
  josa:
    image: gt-josa:prod
    mem_limit: 768m
    restart: unless-stopped

  # Chrome 커넥터(MCP). 외부에 포트를 열지 않고 nginx가 프록시한다. 서버 .env의 MCP_TOKEN_SECRET·PUBLIC_URL을 읽는다.
  mcp:
    image: gt-mcp:prod
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_URL: http://backend:8080
    mem_limit: 256m
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    image: gt-frontend:prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    # certbot이 갱신한 인증서를 쓰도록 6시간마다 설정을 다시 읽는다.
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    depends_on:
      - backend
      - mcp
    restart: unless-stopped

  # Let's Encrypt 인증서 갱신. 만료 30일 전부터 12시간마다 시도한다. 첫 발급은 deploy/setup-https.sh.
  certbot:
    image: certbot/certbot
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"]
    restart: unless-stopped

volumes:
  pgdata:
