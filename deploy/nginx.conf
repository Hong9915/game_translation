# frontend/nginx.conf에 팀 공용 비밀번호(Basic Auth)와 HTTPS(__DOMAIN__)를 더한 운영용 설정
# 인증서는 Let's Encrypt. 처음 한 번은 deploy/setup-https.sh로 받고, 갱신은 compose의 certbot 서비스가 한다.

# MCP 로그인·토큰 경로 요청 제한(IP당 분당 10번, 넘으면 429). 이 파일은 http 수준에 들어간다.
limit_req_zone $binary_remote_addr zone=mcp_login:1m rate=10r/m;

# HTTP: 인증서 발급·갱신 확인 경로만 열고 나머지는 HTTPS 도메인으로 넘긴다(IP로 들어와도).
server {
    listen 80;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 100m;
    large_client_header_buffers 8 64k;

    auth_basic "ThePlayPlus";
    auth_basic_user_file /etc/nginx/htpasswd;

    # 백엔드 API (SSE 진행률 스트림을 위해 버퍼링 끔)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        # 백엔드에 Basic Auth 헤더를 넘기지 않는다
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # MCP 커넥터: 자체 OAuth(Basic Auth 없이, 출입증으로 인증)와 /mcp 엔드포인트
    # mcp 주소는 요청 때 Docker DNS(127.0.0.11)로 찾는다 — 고정 proxy_pass면 mcp가 없거나 죽어 있을 때
    # nginx가 "host not found"로 아예 뜨지 않아 사이트 전체가 내려간다. 이렇게 하면 mcp 경로만 502가 된다.
    # 변수 proxy_pass에 URI를 붙이지 않았으니 원래 요청 URI(쿼리 포함)가 그대로 넘어간다.
    location = /authorize {
        auth_basic off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp_up http://mcp:3000;
        proxy_pass $mcp_up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /token {
        auth_basic off;
        limit_req zone=mcp_login burst=5 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp_up http://mcp:3000;
        proxy_pass $mcp_up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /register {
        auth_basic off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp_up http://mcp:3000;
        proxy_pass $mcp_up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /.well-known/oauth- {
        auth_basic off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp_up http://mcp:3000;
        proxy_pass $mcp_up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /oauth/ {
        auth_basic off;
        limit_req zone=mcp_login burst=5 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp_up http://mcp:3000;
        proxy_pass $mcp_up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Authorization 헤더(출입증)는 지우지 않고 그대로 넘긴다.
    location ^~ /mcp {
        auth_basic off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp_up http://mcp:3000;
        proxy_pass $mcp_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # SPA: 없는 경로는 index.html로
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
